
name: ESP32 Firmware Builder

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Select ESP32 project"
        required: true
        type: choice
        options:
          - 02_LCD_I2C_Test
          - 03_RFID_Access_Control

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add \
            board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json

          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.0.7

      - name: Install libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "hd44780"
          arduino-cli lib install "MFRC522"

      - name: Compile firmware
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          mkdir -p firmware

          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --output-dir firmware \
            "projects/$PROJECT"

      - name: Install esptool
        run: |
          python -m pip install esptool==4.8.1

      - name: Create merged BIN
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          BOOT_APP0=$(find \
            "$HOME/.arduino15/packages/esp32" \
            -name boot_app0.bin \
            -print -quit)

          test -n "$BOOT_APP0"

          FILE="ESP32_WROOM32_${PROJECT}_Merged_Flash_0x0.bin"

          python -m esptool --chip esp32 merge_bin \
            -o "$FILE" \
            --flash_mode dio \
            --flash_freq 40m \
            --flash_size 4MB \
            0x1000 "firmware/${PROJECT}.ino.bootloader.bin" \
            0x8000 "firmware/${PROJECT}.ino.partitions.bin" \
            0xe000 "$BOOT_APP0" \
            0x10000 "firmware/${PROJECT}.ino.bin"

          test -s "$FILE"

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT: ${{ inputs.project }}
        run: |
          FILE="ESP32_WROOM32_${PROJECT}_Merged_Flash_0x0.bin"
          TAG="esp32-${PROJECT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          gh release create "$TAG" "$FILE" \
            --target "$GITHUB_SHA" \
            --title "ESP32 ${PROJECT}" \
            --notes "Flash merged BIN at offset 0x0000."

          echo "### Firmware ready" >> "$GITHUB_STEP_SUMMARY"
          echo "[$FILE](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${FILE})" >> "$GITHUB_STEP_SUMMARY"
