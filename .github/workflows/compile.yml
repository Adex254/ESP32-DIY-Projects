
name: ESP32 Build and Direct BIN Download

on:
  workflow_dispatch:
  push:
    paths:
      - "ESP32_Blink/**"
      - ".github/workflows/compile.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.0.7

      - name: Compile firmware
        run: |
          mkdir -p firmware
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --output-dir firmware \
            ESP32_Blink

      - name: Install esptool
        run: |
          python -m pip install esptool==4.8.1

      - name: Merge firmware
        run: |
          BOOT_APP0=$(find "$HOME/.arduino15/packages/esp32" \
            -name boot_app0.bin -print -quit)

          test -n "$BOOT_APP0"

          python -m esptool --chip esp32 merge_bin \
            -o ESP32_WROOM32_LED_Blink_Merged_Flash_0x0.bin \
            --flash_mode dio \
            --flash_freq 40m \
            --flash_size 4MB \
            0x1000 firmware/ESP32_Blink.ino.bootloader.bin \
            0x8000 firmware/ESP32_Blink.ino.partitions.bin \
            0xe000 "$BOOT_APP0" \
            0x10000 firmware/ESP32_Blink.ino.bin

      - name: Publish BIN to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="ESP32_WROOM32_LED_Blink_Merged_Flash_0x0.bin"
          TAG="esp32-blink-${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" "$FILE" \
            --target "$GITHUB_SHA" \
            --title "ESP32 LED Blink Build ${GITHUB_RUN_NUMBER}" \
            --notes "Merged ESP32 firmware. Flash at address 0x0."
