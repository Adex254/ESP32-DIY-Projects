
      - name: Merge firmware into one BIN
        run: |
          python -m esptool --chip esp32 merge-bin \
            -o ESP32_WROOM32_LED_Blink_Merged_Flash_0x0.bin \
            --flash-mode dio \
            --flash-freq 40m \
            --flash-size 4MB \
            0x1000 firmware/ESP32_Blink.ino.bootloader.bin \
            0x8000 firmware/ESP32_Blink.ino.partitions.bin \
            0x10000 firmware/ESP32_Blink.ino.bin

      - name: Publish direct BIN download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="ESP32_WROOM32_LED_Blink_Merged_Flash_0x0.bin"
          TAG="esp32-led-blink-latest"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" \
              --title "ESP32 WROOM32 - LED Blink" \
              --notes "Merged firmware for flashing at 0x0."
          fi
